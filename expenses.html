<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>JebiSathi — Expenses</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=DM+Serif+Display&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="config.js"></script>
</head>
<body>

<div id="authScreen">
  <h1>JebiSathi</h1>
  <p>Sign in to continue.</p>
  <div class="auth-card">
    <div class="auth-error" id="authError"></div>
    <input type="email" id="authEmail" placeholder="Email">
    <div class="password-wrap">
      <input type="password" id="authPassword" placeholder="Password">
      <button type="button" class="password-toggle" id="togglePassword" title="Show password">👁</button>
    </div>
    <button class="primary" id="authSubmit">Sign in</button>
  </div>
</div>

<div class="wrap hidden" id="appScreen">
  <div class="topnav">
    <div class="brand">JebiSathi</div>
    <div class="links">
      <a href="index.html">Dashboard</a>
      <a href="expenses.html" class="active">Expenses</a>
    </div>
    <div class="who">
      <span id="userEmail"></span>
      <button class="signout" id="signOutBtn">Sign out</button>
    </div>
  </div>

  <div id="noActive" class="card hidden">
    <div class="label">No duration running</div>
    <p style="color:var(--muted);font-size:0.88rem;margin:6px 0 14px;">Start one from the dashboard before adding expenses.</p>
    <a href="index.html"><button class="primary" type="button">Go to dashboard</button></a>
  </div>

  <div id="activeContent" class="hidden">
    <header>
      <h1 id="periodTitle">Duration</h1>
      <p id="periodSub"></p>
    </header>

    <div class="cards">
      <div class="card">
        <div class="label">Spent so far</div>
        <div class="value" id="totalSpent">Rs. 0</div>
      </div>
      <div class="card" id="remainingCard">
        <div class="label">Remaining budget</div>
        <div class="value" id="remaining">Rs. 0</div>
      </div>
    </div>

    <div class="section-title">Your categories</div>
    <div class="card">
      <div class="cat-chip-row" id="categoryChips"></div>
      <div class="cat-add-row">
        <input type="text" id="newCategoryInput" placeholder="New category name">
        <button class="primary" id="addCategoryBtn" type="button">Add</button>
      </div>
    </div>

    <div class="section-title">Expected expenses by category</div>
    <div class="card">
      <div class="cat-budget-grid" id="catBudgetGrid"></div>
    </div>

    <div class="section-title">Actual vs expected</div>
    <div class="card" id="barsCard">
      <div id="categoryBars"></div>
    </div>

    <div class="section-title">Add an expense</div>
    <div class="card">
      <form class="add" id="addForm">
        <input type="number" id="amount" placeholder="Amount (Rs.)" min="0" step="0.01" required>
        <select id="category"></select>
        <div id="newCategoryInline" class="hidden">
          <input type="text" id="inlineNewCategoryInput" placeholder="Category name">
          <button class="ghost" id="inlineNewCategoryConfirm" type="button">Add</button>
          <button class="ghost" id="inlineNewCategoryCancel" type="button">Cancel</button>
        </div>
        <input type="text" id="note" placeholder="Note (optional)">
        <button class="primary" type="submit">Add expense</button>
      </form>
    </div>

    <div class="section-title">Entries</div>
    <div class="card">
      <div id="entryList"></div>
    </div>
  </div>
</div>

<script>
const DEFAULT_CATEGORIES = ['Food','Rent','Transport','Groceries','Utilities','Health','Entertainment','Other'];
const COLOR_PALETTE = ['#e8a33d','#4fd1c5','#e8664f','#7c9eff','#c792ea','#f6c177','#6fcf97','#ff8fab','#56cfe1','#f4a261'];
const sb = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

// ---------- AUTO SIGN-OUT AFTER 6 HOURS OF INACTIVITY ----------
const INACTIVITY_LIMIT_MS = 6 * 60 * 60 * 1000;
const LAST_ACTIVE_KEY = 'ledger:lastActive';
function markActive(){ localStorage.setItem(LAST_ACTIVE_KEY, Date.now().toString()); }
function checkInactivity(){
  const last = Number(localStorage.getItem(LAST_ACTIVE_KEY));
  if(last && (Date.now() - last) > INACTIVITY_LIMIT_MS){
    sb.auth.signOut();
  } else {
    markActive();
  }
}
['click','keydown','mousemove','scroll','touchstart'].forEach(evt => document.addEventListener(evt, markActive, {passive:true}));
markActive();
checkInactivity();
setInterval(checkInactivity, 5 * 60 * 1000);
let currentUser = null;
let activePeriod = null;
let expenses = [];
let catBudgets = {};
let categories = [];

function fmt(n){ return 'Rs. ' + Number(n).toLocaleString('en-IN', {maximumFractionDigits: 2}); }
function fmtDate(d){ return new Date(d).toLocaleDateString('en-IN', {day:'2-digit', month:'short'}); }
function catColor(name){ const c = categories.find(cc => cc.name === name); return c ? c.color : '#e8a33d'; }

document.getElementById('authSubmit').addEventListener('click', async () => {
  const email = document.getElementById('authEmail').value.trim();
  const password = document.getElementById('authPassword').value;
  const errEl = document.getElementById('authError');
  errEl.textContent = '';
  const { error } = await sb.auth.signInWithPassword({ email, password });
  if(error){ errEl.textContent = error.message; }
});

document.getElementById('togglePassword').addEventListener('click', () => {
  const inp = document.getElementById('authPassword');
  const btn = document.getElementById('togglePassword');
  const show = inp.type === 'password';
  inp.type = show ? 'text' : 'password';
  btn.textContent = show ? '🙈' : '👁';
});

document.getElementById('signOutBtn').addEventListener('click', async () => { await sb.auth.signOut(); });

sb.auth.onAuthStateChange((event, session) => {
  if(session){
    currentUser = session.user;
    document.getElementById('authScreen').classList.add('hidden');
    document.getElementById('appScreen').classList.remove('hidden');
    document.getElementById('userEmail').textContent = currentUser.email;
    loadPage();
  } else {
    currentUser = null;
    document.getElementById('appScreen').classList.add('hidden');
    document.getElementById('authScreen').classList.remove('hidden');
  }
});

async function loadPage(){
  await ensureCategories();

  const { data: periods } = await sb.from('periods').select('*').is('ended_at', null).limit(1);
  activePeriod = (periods && periods[0]) || null;

  renderCategoryChips();
  renderCategorySelect();

  if(!activePeriod){
    document.getElementById('noActive').classList.remove('hidden');
    document.getElementById('activeContent').classList.add('hidden');
    return;
  }
  document.getElementById('noActive').classList.add('hidden');
  document.getElementById('activeContent').classList.remove('hidden');
  document.getElementById('periodTitle').textContent = activePeriod.name;
  document.getElementById('periodSub').textContent = 'Running since ' + fmtDate(activePeriod.started_at);

  const { data: exp } = await sb.from('expenses').select('*').eq('period_id', activePeriod.id).order('created_at', {ascending:false});
  expenses = exp || [];

  const { data: catBud } = await sb.from('category_budgets').select('category, expected').eq('period_id', activePeriod.id);
  catBudgets = {};
  (catBud || []).forEach(row => { catBudgets[row.category] = Number(row.expected); });

  renderCatBudgetGrid();
  render();
}

async function ensureCategories(){
  const { data } = await sb.from('categories').select('*').order('created_at', {ascending:true});
  if(!data || data.length === 0){
    const rows = DEFAULT_CATEGORIES.map((name, i) => ({ user_id: currentUser.id, name, color: COLOR_PALETTE[i % COLOR_PALETTE.length] }));
    const { data: inserted } = await sb.from('categories').insert(rows).select();
    categories = inserted || [];
  } else {
    categories = data;
  }
}

function renderCategoryChips(){
  const el = document.getElementById('categoryChips');
  if(categories.length === 0){ el.innerHTML = '<div class="empty">No categories yet — add one below.</div>'; return; }
  el.innerHTML = categories.map(c => `
    <span class="cat-chip ${c.is_archived ? 'archived' : ''}" style="color:${c.color};background:${c.color}22;border:1px solid ${c.color}55;">
      <span class="cat-dot" style="background:${c.color}"></span>${c.name}
      ${c.is_archived
        ? `<button class="chip-action" data-action="restore" data-id="${c.id}" title="Restore">↺</button>`
        : `<button class="chip-action" data-action="archive" data-id="${c.id}" title="Remove">✕</button>`}
    </span>`).join('');
}

function renderCategorySelect(){
  const sel = document.getElementById('category');
  const active = categories.filter(c => !c.is_archived);
  sel.innerHTML = active.map(c => `<option value="${c.name}">${c.name}</option>`).join('')
    + '<option value="__new__">+ Create new category</option>';
}

document.getElementById('categoryChips').addEventListener('click', async (ev) => {
  const btn = ev.target.closest('.chip-action');
  if(!btn) return;
  const id = btn.dataset.id;
  const action = btn.dataset.action;
  const { error } = await sb.from('categories').update({ is_archived: action === 'archive' }).eq('id', id);
  if(error){ alert('Could not update category: ' + error.message); return; }
  await loadPage();
});

document.getElementById('addCategoryBtn').addEventListener('click', () => addCategory(document.getElementById('newCategoryInput')));
document.getElementById('newCategoryInput').addEventListener('keydown', (ev) => {
  if(ev.key === 'Enter'){ ev.preventDefault(); addCategory(document.getElementById('newCategoryInput')); }
});

async function addCategory(inputEl){
  const raw = inputEl.value.trim();
  if(!raw) return;
  const activeMatch = categories.find(c => c.name.toLowerCase() === raw.toLowerCase() && !c.is_archived);
  if(activeMatch){ alert('That category already exists.'); return; }
  const archivedMatch = categories.find(c => c.name.toLowerCase() === raw.toLowerCase() && c.is_archived);
  if(archivedMatch){
    const { error } = await sb.from('categories').update({ is_archived: false }).eq('id', archivedMatch.id);
    if(error){ alert('Could not restore: ' + error.message); return; }
    inputEl.value = '';
    await loadPage();
    return;
  }
  const color = COLOR_PALETTE[categories.length % COLOR_PALETTE.length];
  const { error } = await sb.from('categories').insert({ user_id: currentUser.id, name: raw, color });
  if(error){ alert('Could not add category: ' + error.message); return; }
  inputEl.value = '';
  await loadPage();
}

document.getElementById('category').addEventListener('change', (ev) => {
  const inline = document.getElementById('newCategoryInline');
  inline.classList.toggle('hidden', ev.target.value !== '__new__');
  if(ev.target.value === '__new__') document.getElementById('inlineNewCategoryInput').focus();
});

document.getElementById('inlineNewCategoryCancel').addEventListener('click', () => {
  document.getElementById('newCategoryInline').classList.add('hidden');
  document.getElementById('category').selectedIndex = 0;
});

document.getElementById('inlineNewCategoryConfirm').addEventListener('click', async () => {
  const input = document.getElementById('inlineNewCategoryInput');
  const raw = input.value.trim();
  if(!raw) return;
  const exists = categories.some(c => c.name.toLowerCase() === raw.toLowerCase() && !c.is_archived);
  if(exists){ alert('That category already exists.'); return; }
  const color = COLOR_PALETTE[categories.length % COLOR_PALETTE.length];
  const { data: inserted, error } = await sb.from('categories').insert({ user_id: currentUser.id, name: raw, color }).select().single();
  if(error){ alert('Could not add: ' + error.message); return; }
  categories.push(inserted);
  renderCategorySelect();
  renderCategoryChips();
  document.getElementById('category').value = raw;
  document.getElementById('newCategoryInline').classList.add('hidden');
  input.value = '';
});

function renderCatBudgetGrid(){
  const grid = document.getElementById('catBudgetGrid');
  const active = categories.filter(c => !c.is_archived);
  if(active.length === 0){ grid.innerHTML = '<div class="empty">Add a category above to set an expected amount.</div>'; return; }
  grid.innerHTML = active.map(cat => `
    <div class="cat-budget-row">
      <label><span class="cat-dot" style="background:${cat.color}"></span>${cat.name}</label>
      <input type="number" min="0" step="0.01" data-cat="${cat.name}" value="${catBudgets[cat.name] || ''}" placeholder="0">
    </div>`).join('');
}

document.getElementById('catBudgetGrid').addEventListener('change', async (ev) => {
  if(ev.target.tagName === 'INPUT'){
    const category = ev.target.dataset.cat;
    const expected = Number(ev.target.value) || 0;
    const { error } = await sb.from('category_budgets').upsert(
      { user_id: currentUser.id, period_id: activePeriod.id, category, expected },
      { onConflict: 'period_id,category' }
    );
    if(error){ alert('Could not save: ' + error.message); return; }
    catBudgets[category] = expected;
    render();
  }
});

document.getElementById('addForm').addEventListener('submit', async (ev) => {
  ev.preventDefault();
  const amount = Number(document.getElementById('amount').value);
  const category = document.getElementById('category').value;
  const note = document.getElementById('note').value.trim();
  if(!amount || amount <= 0) return;
  if(category === '__new__'){ alert('Finish creating the new category first, or pick an existing one.'); return; }
  const { error } = await sb.from('expenses').insert({
    user_id: currentUser.id, period_id: activePeriod.id, amount, category, note
  });
  if(error){ alert('Could not save: ' + error.message); return; }
  ev.target.reset();
  loadPage();
});

document.getElementById('entryList').addEventListener('click', async (ev) => {
  if(ev.target.classList.contains('del')){
    const id = ev.target.closest('.entry').dataset.id;
    const { error } = await sb.from('expenses').delete().eq('id', id);
    if(error){ alert('Could not delete: ' + error.message); return; }
    loadPage();
  }
});

function render(){
  const total = expenses.reduce((s,e) => s + Number(e.amount), 0);
  document.getElementById('totalSpent').textContent = fmt(total);

  const remainingCard = document.getElementById('remainingCard');
  const remainingEl = document.getElementById('remaining');
  if(activePeriod.budget > 0){
    const remaining = activePeriod.budget - total;
    remainingEl.textContent = fmt(remaining);
    remainingCard.classList.toggle('over', remaining < 0);
    remainingCard.classList.toggle('under', remaining >= 0);
  } else {
    remainingEl.textContent = '— not set';
    remainingCard.classList.remove('over','under');
  }

  const byCat = {};
  expenses.forEach(e => { byCat[e.category] = (byCat[e.category]||0) + Number(e.amount); });
  const activeNames = categories.filter(c => !c.is_archived).map(c => c.name);
  const allCatNames = [...new Set([...Object.keys(byCat), ...activeNames])];
  const relevantCats = allCatNames.filter(c => (byCat[c] || 0) > 0 || (catBudgets[c] || 0) > 0);
  const maxCat = Math.max(1, ...relevantCats.map(c => Math.max(byCat[c] || 0, catBudgets[c] || 0)));
  const sortedCats = relevantCats.sort((a,b) => (byCat[b]||0) - (byCat[a]||0));

  document.getElementById('categoryBars').innerHTML = sortedCats.length === 0
    ? '<div class="empty">No expenses yet for this duration.</div>'
    : sortedCats.map(cat => {
        const actual = byCat[cat] || 0;
        const expected = catBudgets[cat] || 0;
        const fillPct = (actual / maxCat * 100).toFixed(1);
        const markerPct = expected > 0 ? (expected / maxCat * 100).toFixed(1) : null;
        const fillColor = expected > 0 ? (actual > expected ? 'var(--red)' : 'var(--teal)') : catColor(cat);
        const expectedLabel = expected > 0 ? `<span class="exp"> / ${fmt(expected)} expected</span>` : '';
        return `
          <div class="bar-row">
            <div class="bar-top"><span>${cat}</span><span class="amt">${fmt(actual)}${expectedLabel}</span></div>
            <div class="bar-track">
              <div class="bar-fill" style="width:${fillPct}%;background:${fillColor}"></div>
              ${markerPct !== null ? `<div class="bar-marker" style="left:${markerPct}%"></div>` : ''}
            </div>
          </div>`;
      }).join('');

  const listEl = document.getElementById('entryList');
  listEl.innerHTML = expenses.length === 0
    ? '<div class="empty">No expenses yet — add your first one above.</div>'
    : expenses.map(e => `
        <div class="entry" data-id="${e.id}">
          <span class="cat" style="color:${catColor(e.category)};background:${catColor(e.category)}22;">${e.category}</span>
          <span class="note">${e.note ? e.note : ''}</span>
          <span class="leader"></span>
          <span class="date">${fmtDate(e.created_at)}</span>
          <span class="amt">${fmt(e.amount)}</span>
          <button class="del" title="Delete">✕</button>
        </div>`).join('');
}
</script>
</body>
</html>
