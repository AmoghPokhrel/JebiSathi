<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Ledger — Expense Tracker</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=DM+Serif+Display&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">
<style>
  :root{
    --bg: #14181f;
    --card: #1c2230;
    --card-hi: #232a3a;
    --line: #2c3346;
    --gold: #e8a33d;
    --teal: #4fd1c5;
    --red: #e8664f;
    --text: #f2f4f8;
    --muted: #8b93a7;
  }
  *{box-sizing:border-box;}
  body{
    margin:0;
    background:var(--bg);
    color:var(--text);
    font-family:'Inter',sans-serif;
    min-height:100vh;
    padding:32px 16px 80px;
  }
  .wrap{max-width:640px;margin:0 auto;}
  header{margin-bottom:28px;}
  header h1{
    font-family:'DM Serif Display',serif;
    font-size:2.1rem;
    margin:0 0 4px;
    letter-spacing:0.3px;
  }
  header p{color:var(--muted);margin:0;font-size:0.92rem;}

  .cards{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-bottom:24px;}
  .card{
    background:var(--card);
    border:1px solid var(--line);
    border-radius:10px;
    padding:16px 18px;
  }
  .card .label{font-size:0.72rem;color:var(--muted);text-transform:uppercase;letter-spacing:0.08em;margin-bottom:6px;}
  .card .value{font-family:'JetBrains Mono',monospace;font-size:1.5rem;font-weight:700;}
  .card.over .value{color:var(--red);}
  .card.under .value{color:var(--teal);}

  .budget-row{
    display:flex;gap:10px;align-items:center;margin-bottom:24px;
    background:var(--card);border:1px solid var(--line);border-radius:10px;padding:12px 16px;
  }
  .budget-row label{font-size:0.85rem;color:var(--muted);white-space:nowrap;}
  .budget-row input{
    flex:1;background:transparent;border:none;color:var(--gold);
    font-family:'JetBrains Mono',monospace;font-size:1rem;outline:none;
  }
  .budget-row button{
    background:none;border:1px solid var(--line);color:var(--muted);
    padding:6px 10px;border-radius:6px;font-size:0.78rem;cursor:pointer;
  }
  .budget-row button:hover{border-color:var(--gold);color:var(--gold);}

  .bars{margin-bottom:28px;}
  .bar-row{margin-bottom:10px;}
  .bar-top{display:flex;justify-content:space-between;font-size:0.82rem;margin-bottom:4px;color:var(--muted);}
  .bar-top span.amt{font-family:'JetBrains Mono',monospace;color:var(--text);}
  .bar-track{height:6px;background:var(--line);border-radius:4px;overflow:hidden;}
  .bar-fill{height:100%;background:var(--gold);border-radius:4px;}

  form.add{
    display:grid;
    grid-template-columns: 1fr 1fr;
    gap:10px;
    background:var(--card);
    border:1px solid var(--line);
    border-radius:10px;
    padding:16px;
    margin-bottom:28px;
  }
  form.add input, form.add select{
    background:var(--card-hi);
    border:1px solid var(--line);
    color:var(--text);
    padding:10px 12px;
    border-radius:8px;
    font-family:'Inter',sans-serif;
    font-size:0.9rem;
    outline:none;
  }
  form.add input:focus, form.add select:focus{border-color:var(--gold);}
  form.add input[type="text"]{grid-column:1/3;}
  form.add button{
    grid-column:1/3;
    background:var(--gold);
    color:#1a1408;
    border:none;
    padding:11px;
    border-radius:8px;
    font-weight:700;
    cursor:pointer;
    font-size:0.92rem;
  }
  form.add button:hover{filter:brightness(1.08);}

  .section-title{
    font-size:0.75rem;color:var(--muted);text-transform:uppercase;
    letter-spacing:0.08em;margin:0 0 12px;
  }

  .entry{
    display:flex;align-items:baseline;gap:8px;
    padding:10px 2px;border-bottom:1px dashed var(--line);
  }
  .entry .cat{
    font-size:0.72rem;color:var(--gold);background:rgba(232,163,61,0.12);
    padding:2px 8px;border-radius:20px;white-space:nowrap;
  }
  .entry .note{flex:0 1 auto;font-size:0.9rem;color:var(--text);}
  .entry .leader{flex:1;border-bottom:1px dotted var(--line);position:relative;top:-3px;min-width:8px;}
  .entry .date{font-size:0.72rem;color:var(--muted);white-space:nowrap;}
  .entry .amt{font-family:'JetBrains Mono',monospace;font-weight:600;white-space:nowrap;}
  .entry .del{
    background:none;border:none;color:var(--muted);cursor:pointer;font-size:0.9rem;
    padding:0 0 0 6px;
  }
  .entry .del:hover{color:var(--red);}

  .empty{color:var(--muted);font-size:0.88rem;padding:20px 0;text-align:center;}

  .vocab{
    margin-top:36px;padding:14px 16px;border-left:3px solid var(--teal);
    background:var(--card);border-radius:0 8px 8px 0;font-size:0.85rem;color:var(--muted);
  }
  .vocab b{color:var(--teal);font-family:'JetBrains Mono',monospace;}

  @media (max-width:420px){
    .cards{grid-template-columns:1fr;}
  }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>Ledger</h1>
    <p>Your monthly spending, kept honest.</p>
  </header>

  <div class="cards">
    <div class="card">
      <div class="label">Spent this month</div>
      <div class="value" id="totalSpent">Rs. 0</div>
    </div>
    <div class="card" id="remainingCard">
      <div class="label">Remaining budget</div>
      <div class="value" id="remaining">Rs. 0</div>
    </div>
  </div>

  <div class="budget-row">
    <label for="budgetInput">Monthly budget</label>
    <input id="budgetInput" type="number" placeholder="e.g. 20000" min="0">
    <button id="saveBudget">Save</button>
  </div>

  <div class="bars" id="categoryBars"></div>

  <form class="add" id="addForm">
    <input type="number" id="amount" placeholder="Amount (Rs.)" min="0" step="0.01" required>
    <select id="category">
      <option>Food</option>
      <option>Rent</option>
      <option>Transport</option>
      <option>Groceries</option>
      <option>Utilities</option>
      <option>Health</option>
      <option>Entertainment</option>
      <option>Other</option>
    </select>
    <input type="text" id="note" placeholder="Note (optional)">
    <button type="submit">Add expense</button>
  </form>

  <div class="section-title">Recent entries</div>
  <div id="entryList"></div>

  <div class="vocab">
    Word of the day: <b>frugal</b> — careful with money, avoiding unnecessary spending. A frugal week is exactly what a tight budget calls for.
  </div>
</div>

<script>
const STORAGE_KEY = 'expenses:list';
const BUDGET_KEY = 'expenses:budget';
let expenses = [];
let budget = 0;

function currentMonthKey(d = new Date()){
  return d.getFullYear() + '-' + String(d.getMonth()+1).padStart(2,'0');
}

function fmt(n){
  return 'Rs. ' + Number(n).toLocaleString('en-IN', {maximumFractionDigits: 2});
}

async function loadData(){
  try{
    const raw = localStorage.getItem(STORAGE_KEY);
    expenses = raw ? JSON.parse(raw) : [];
  }catch(e){ expenses = []; }
  try{
    const raw = localStorage.getItem(BUDGET_KEY);
    budget = raw ? JSON.parse(raw) : 0;
  }catch(e){ budget = 0; }
  document.getElementById('budgetInput').value = budget || '';
  render();
}

async function saveExpenses(){
  try{ localStorage.setItem(STORAGE_KEY, JSON.stringify(expenses)); }
  catch(e){ console.error('Could not save expenses', e); }
}

async function saveBudget(){
  try{ localStorage.setItem(BUDGET_KEY, JSON.stringify(budget)); }
  catch(e){ console.error('Could not save budget', e); }
}

function monthExpenses(){
  const mk = currentMonthKey();
  return expenses.filter(e => e.date.startsWith(mk));
}

function render(){
  const monthly = monthExpenses();
  const total = monthly.reduce((s,e) => s + Number(e.amount), 0);
  document.getElementById('totalSpent').textContent = fmt(total);

  const remainingCard = document.getElementById('remainingCard');
  const remainingEl = document.getElementById('remaining');
  if(budget > 0){
    const remaining = budget - total;
    remainingEl.textContent = fmt(remaining);
    remainingCard.classList.toggle('over', remaining < 0);
    remainingCard.classList.toggle('under', remaining >= 0);
  } else {
    remainingEl.textContent = '— not set';
    remainingCard.classList.remove('over','under');
  }

  // category bars
  const byCat = {};
  monthly.forEach(e => { byCat[e.category] = (byCat[e.category]||0) + Number(e.amount); });
  const maxCat = Math.max(1, ...Object.values(byCat));
  const barsEl = document.getElementById('categoryBars');
  const cats = Object.entries(byCat).sort((a,b) => b[1]-a[1]);
  if(cats.length === 0){
    barsEl.innerHTML = '';
  } else {
    barsEl.innerHTML = '<div class="section-title">By category</div>' + cats.map(([cat, amt]) => `
      <div class="bar-row">
        <div class="bar-top"><span>${cat}</span><span class="amt">${fmt(amt)}</span></div>
        <div class="bar-track"><div class="bar-fill" style="width:${(amt/maxCat*100).toFixed(0)}%"></div></div>
      </div>
    `).join('');
  }

  // entry list (most recent first, all-time)
  const listEl = document.getElementById('entryList');
  const sorted = [...expenses].sort((a,b) => new Date(b.date) - new Date(a.date));
  if(sorted.length === 0){
    listEl.innerHTML = '<div class="empty">No expenses yet — add your first one above.</div>';
  } else {
    listEl.innerHTML = sorted.map(e => `
      <div class="entry" data-id="${e.id}">
        <span class="cat">${e.category}</span>
        <span class="note">${e.note ? e.note : ''}</span>
        <span class="leader"></span>
        <span class="date">${new Date(e.date).toLocaleDateString('en-IN', {day:'2-digit', month:'short'})}</span>
        <span class="amt">${fmt(e.amount)}</span>
        <button class="del" title="Delete">✕</button>
      </div>
    `).join('');
  }
}

document.getElementById('addForm').addEventListener('submit', async (ev) => {
  ev.preventDefault();
  const amount = document.getElementById('amount').value;
  const category = document.getElementById('category').value;
  const note = document.getElementById('note').value.trim();
  if(!amount || Number(amount) <= 0) return;

  expenses.push({
    id: Date.now().toString(),
    amount: Number(amount),
    category,
    note,
    date: new Date().toISOString()
  });
  await saveExpenses();
  ev.target.reset();
  render();
});

document.getElementById('entryList').addEventListener('click', async (ev) => {
  if(ev.target.classList.contains('del')){
    const id = ev.target.closest('.entry').dataset.id;
    expenses = expenses.filter(e => e.id !== id);
    await saveExpenses();
    render();
  }
});

document.getElementById('saveBudget').addEventListener('click', async () => {
  const val = Number(document.getElementById('budgetInput').value) || 0;
  budget = val;
  await saveBudget();
  render();
});

loadData();
</script>
</body>
</html>
